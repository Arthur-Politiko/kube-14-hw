apiVersion: apps/v1
kind: Deployment
metadata: 
  name: nginx-dev
  namespace: task1
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: nginx-dev
  template:
    metadata:
      labels:
        app: nginx-dev
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      - name: dev
        image: wbitt/network-multitool:latest
        ports:
        - containerPort: 8080
        env:                           
          - name: HTTP_PORT
            value: "8080"              # tune multitool to listen on 8080
          # - name: HTTPS_PORT
          #   value: "8443"              #  HTTPS
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
